kind: aarti
status: draft
title: { hinglish: Maa Katyayani ki Aarti, hi: माँ कात्यायनी की आरती }
aka: ["Katyayani Mata ki Aarti", "Katyayini", "कात्यायनी माता की आरती"]
youtube: { id: "dGFpWzGSxJo", by: Anuradha Paudwal, sameText: false }
subtitle: { hinglish: Navratri Din 6, hi: नवरात्रि दिन 6 }
parts:
  - verses:
      - ["जय जय अंबे जय कात्यायनी ।", "जय जग माता जग की महारानी ॥"]
      - ["बैजनाथ स्थान तुम्हारा ।", "वहाँ वरदाती नाम पुकारा ॥"]
      - ["कई नाम हैं कई धाम हैं ।", "यह स्थान भी तो सुखधाम है ॥"]
      - ["हर मंदिर में जोत तुम्हारी ।", "कहीं योगेश्वरी महिमा न्यारी ॥"]
      - ["हर जगह उत्सव होते रहते ।", "हर मंदिर में भक्त हैं कहते ॥"]
      - ["कात्यायनी रक्षक काया की ।", "ग्रंथि काटे मोह माया की ॥"]
      - ["झूठे मोह से छुड़ाने वाली ।", "अपना नाम जपाने वाली ॥"]
      - ["बृहस्पतिवार को पूजा करियो ।", "ध्यान कात्यायनी का धरियो ॥"]
      - ["हर संकट को दूर करेगी ।", "भंडारे भरपूर करेगी ॥"]
      - ["जो भी माँ को भक्त पुकारे ।", "कात्यायनी सब कष्ट निवारे ॥"]
