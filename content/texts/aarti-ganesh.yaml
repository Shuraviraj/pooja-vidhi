kind: aarti
status: draft
title: { hinglish: Shri Ganesh ji ki Aarti, hi: श्री गणेश जी की आरती }
aka: ["Jai Ganesh Jai Ganesh Deva", "जय गणेश जय गणेश देवा", "Ganpati Aarti"]
youtube: { id: "GKMSZ8SN0IA", sameText: true }
subtitle: { hinglish: Har din aarti ki shuruaat isi se, hi: हर दिन आरती का आरंभ इसी से }
refrain: जय गणेश जय गणेश जय गणेश देवा …
parts:
  - verses:
      - [जय गणेश जय गणेश जय गणेश देवा ।, माता जाकी पार्वती पिता महादेवा ॥]
      - [एक दंत दयावंत चार भुजा धारी ।, माथे सिंदूर सोहे मूसे की सवारी ॥]
      - [पान चढ़े फल चढ़े और चढ़े मेवा ।, लड्डुअन का भोग लगे संत करें सेवा ॥]
      - [अंधन को आँख देत कोढ़िन को काया ।, बाँझन को पुत्र देत निर्धन को माया ॥]
      - [सूर श्याम शरण आए सफल कीजे सेवा ।, माता जाकी पार्वती पिता महादेवा ॥]
note:
  hinglish: Iske baad us din ki Devi ki aarti, phir Durga ji ki aarti.
  hi: इसके बाद उस दिन की देवी की आरती, फिर दुर्गा जी की आरती।
