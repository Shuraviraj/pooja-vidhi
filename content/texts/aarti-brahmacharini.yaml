kind: aarti
status: draft
title: { hinglish: Maa Brahmacharini ki Aarti, hi: माँ ब्रह्मचारिणी की आरती }
aka: ["Brahmacharini Mata ki Aarti", "Brahmcharini", "ब्रह्मचारिणी माता की आरती"]
youtube: { id: "Jz8dtHxh3Lc", by: Anuradha Paudwal, sameText: false }
subtitle: { hinglish: Navratri Din 2, hi: नवरात्रि दिन 2 }
parts:
  - verses:
      - ["जय अंबे ब्रह्मचारिणी माता ।", "जय चतुरानन प्रिय सुख दाता ॥"]
      - ["ब्रह्मा जी के मन भाती हो ।", "ज्ञान सभी को सिखलाती हो ॥"]
      - ["ब्रह्म मंत्र है जाप तुम्हारा ।", "जिसको जपे सकल संसारा ॥"]
      - ["जय गायत्री वेद की माता ।", "जो मन निस दिन तुम्हें ध्याता ॥"]
      - ["कमी कोई रहने न पाए ।", "कोई भी दुख सहने न पाए ॥"]
      - ["उसकी विरति रहे ठिकाने ।", "जो तेरी महिमा को जाने ॥"]
      - ["रुद्राक्ष की माला ले कर ।", "जपे जो मंत्र श्रद्धा दे कर ॥"]
      - ["आलस छोड़ करे गुणगाना ।", "माँ तुम उसको सुख पहुँचाना ॥"]
      - ["ब्रह्मचारिणी तेरो नाम ।", "पूर्ण करो सब मेरे काम ॥"]
      - ["भक्त तेरे चरणों का पुजारी ।", "रखना लाज मेरी महतारी ॥"]
