kind: aarti
status: draft
title: { hinglish: Maa Skandamata ki Aarti, hi: माँ स्कंदमाता की आरती }
subtitle: { hinglish: Navratri Din 5, hi: नवरात्रि दिन 5 }
parts:
  - verses:
      - ["जय तेरी हो स्कंद माता ।", "पाँचवाँ नाम तुम्हारा आता ॥"]
      - ["सबके मन की जानन हारी ।", "जग जननी सबकी महतारी ॥"]
      - ["तेरी ज्योत जलाता रहूँ मैं ।", "हरदम तुझे ध्याता रहूँ मैं ॥"]
      - ["कई नामों से तुझे पुकारा ।", "मुझे एक है तेरा सहारा ॥"]
      - ["कहीं पहाड़ों पर है डेरा ।", "कई शहरों में तेरा बसेरा ॥"]
      - ["हर मंदिर में तेरे नज़ारे ।", "गुण गाएँ तेरे भक्त प्यारे ॥"]
      - ["भक्ति अपनी मुझे दिला दो ।", "शक्ति मेरी बिगड़ी बना दो ॥"]
      - ["इंद्र आदि देवता मिल सारे ।", "करें पुकार तुम्हारे द्वारे ॥"]
      - ["दुष्ट दैत्य जब चढ़ कर आए ।", "तू ही खंडा हाथ उठाए ॥"]
      - ["दासों को सदा बचाने आयी ।", "भक्त की आस पुजाने आयी ॥"]
