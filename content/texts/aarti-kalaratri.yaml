kind: aarti
status: draft
title: { hinglish: Maa Kalaratri ki Aarti, hi: माँ कालरात्रि की आरती }
aka: ["Kalratri Mata ki Aarti", "Kaalratri", "कालरात्रि माता की आरती"]
youtube: { id: "e-0JyqO0riQ", by: Anuradha Paudwal, sameText: false }
subtitle: { hinglish: Navratri Din 7, hi: नवरात्रि दिन 7 }
parts:
  - verses:
      - ["कालरात्रि जय जय महाकाली ।", "काल के मुँह से बचाने वाली ॥"]
      - ["दुष्ट संघारक नाम तुम्हारा ।", "महाचंडी तेरा अवतारा ॥"]
      - ["पृथ्वी और आकाश पे सारा ।", "महाकाली है तेरा पसारा ॥"]
      - ["खड्ग खप्पर रखने वाली ।", "दुष्टों का लहू चखने वाली ॥"]
      - ["कलकत्ता स्थान तुम्हारा ।", "सब जगह देखूँ तेरा नज़ारा ॥"]
      - ["सभी देवता सब नर-नारी ।", "गावें स्तुति सभी तुम्हारी ॥"]
      - ["रक्तदंता और अन्नपूर्णा ।", "कृपा करे तो कोई भी दुःख ना ॥"]
      - ["ना कोई चिंता रहे ना बीमारी ।", "ना कोई ग़म ना संकट भारी ॥"]
      - ["उस पर कभी कष्ट ना आवें ।", "महाकाली माँ जिसे बचावें ॥"]
      - ["तू भी भक्त प्रेम से कह ।", "कालरात्रि माँ तेरी जय ॥"]
