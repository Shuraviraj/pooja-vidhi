kind: aarti
status: draft
title: { hinglish: Maa Chandraghanta ki Aarti, hi: माँ चंद्रघंटा की आरती }
aka: ["Chandraghanta Mata ki Aarti", "Chandrghanta", "चन्द्रघण्टा माता की आरती"]
youtube: { id: "qQ_3XWmVcgI", by: Anuradha Paudwal, sameText: false }
subtitle: { hinglish: Navratri Din 3, hi: नवरात्रि दिन 3 }
parts:
  - verses:
      - ["जय माँ चंद्रघंटा सुख धाम ।", "पूर्ण कीजो मेरे काम ॥"]
      - ["चंद्र समाज तू शीतल दाती ।", "चंद्र तेज किरणों में समाती ॥"]
      - ["मन की मालक मन भाती हो ।", "चंद्रघंटा तुम वर दाती हो ॥"]
      - ["सुंदर भाव को लाने वाली ।", "हर संकट में बचाने वाली ॥"]
      - ["हर बुधवार जो तुझे ध्याये ।", "श्रद्धा सहित जो विनय सुनाए ॥"]
      - ["मूर्ति चंद्र आकार बनाए ।", "सन्मुख घी की ज्योत जलाए ॥"]
      - ["शीश झुका कहे मन की बाता ।", "पूर्ण आस करो जगत दाता ॥"]
      - ["कांचीपुर स्थान तुम्हारा ।", "कर्नाटिका में मान तुम्हारा ॥"]
      - ["नाम तेरा रटूँ महारानी ।", "भक्त की रक्षा करो भवानी ॥"]
