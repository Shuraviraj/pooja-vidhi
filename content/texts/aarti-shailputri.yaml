kind: aarti
status: draft
title: { hinglish: Maa Shailputri ki Aarti, hi: माँ शैलपुत्री की आरती }
subtitle: { hinglish: Navratri Din 1, hi: नवरात्रि दिन 1 }
parts:
  - verses:
      - ["शैलपुत्री माँ बैल असवार ।", "करें देवता जय जयकार ॥"]
      - ["शिव शंकर की प्रिय भवानी ।", "तेरी महिमा किसी ने ना जानी ॥"]
      - ["पार्वती तू उमा कहलावे ।", "जो तुझे सुमिरे सो सुख पावे ॥"]
      - ["ऋद्धि-सिद्धि परवान करे तू ।", "दया करे धनवान करे तू ॥"]
      - ["सोमवार को शिव संग प्यारी ।", "आरती तेरी जिसने उतारी ॥"]
      - ["उसकी सगरी आस पुजा दो ।", "सगरे दुख तकलीफ मिटा दो ॥"]
      - ["घी का सुंदर दीप जला के ।", "गोला गरी का भोग लगा के ॥"]
      - ["श्रद्धा भाव से मंत्र जपाएँ ।", "प्रेम सहित फिर शीश झुकाएँ ॥"]
      - ["जय गिरिराज किशोरी अंबे ।", "शिव मुख चंद्र चकोरी अंबे ॥"]
      - ["मनोकामना पूर्ण कर दो ।", "चमन सदा सुख संपत्ति भर दो ॥"]
