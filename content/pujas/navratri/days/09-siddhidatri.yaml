about:
  hinglish: Sabhi siddhiyan dene wali Devi. Kamal par virajmaan, sher vahan; chaar haathon mein chakra, shankh, gada aur kamal. Navratri ki poornata inhi ki pooja se hoti hai.
  hi: सभी सिद्धियाँ देने वाली देवी। कमल पर विराजमान, सिंह वाहन; चार हाथों में चक्र, शंख, गदा और कमल। नवरात्रि की पूर्णता इन्हीं की पूजा से होती है।
mool: ॐ देवी सिद्धिदात्र्यै नमः ॥
dhyan:
  - सिद्धगन्धर्वयक्षाद्यैरसुरैरमरैरपि ।
  - सेव्यमाना सदा भूयात् सिद्धिदा सिद्धिदायिनी ॥
aarti: aarti-siddhidatri
