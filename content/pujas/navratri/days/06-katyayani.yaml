about:
  hinglish: Rishi Katyayan ki putri — inhone Mahishasur ka vadh kiya. Sher par sawar, haath mein talwar aur kamal. Maana jaata hai ki shubh vivah ka aashirvaad deti hain.
  hi: महर्षि कात्यायन की पुत्री — इन्होंने महिषासुर का वध किया। सिंह पर सवार, हाथ में तलवार और कमल। मान्यता है कि ये शुभ विवाह का आशीर्वाद देती हैं।
mool: ॐ देवी कात्यायन्यै नमः ॥
dhyan:
