about:
  hinglish: Kartikeya (Skand) ki maa — god mein baal Skand. Kamal par virajmaan, sher vahan. Mamta aur vatsalya ki Devi.
  hi: कार्तिकेय (स्कंद) की माता — गोद में बाल स्कंद। कमल पर विराजमान, सिंह वाहन। ममता और वात्सल्य की देवी।
mool: ॐ देवी स्कन्दमातायै नमः ॥
dhyan:
  - सिंहासनगता नित्यं पद्माश्रितकरद्वया ।
  - शुभदास्तु सदा देवी स्कन्दमाता यशस्विनी ॥
