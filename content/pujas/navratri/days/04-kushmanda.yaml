about:
  hinglish: Maana jaata hai ki apni halki muskaan se inhone brahmand ki rachna ki. Aath bhujaayein (Ashtabhuja Devi), sher par sawar.
  hi: मान्यता है कि अपनी मंद मुस्कान से इन्होंने ब्रह्मांड की रचना की। आठ भुजाएँ (अष्टभुजा देवी), सिंह पर सवार।
mool: ॐ देवी कूष्माण्डायै नमः ॥
dhyan:
  - सुरासम्पूर्णकलशं रुधिराप्लुतमेव च ।
  - दधाना हस्तपद्माभ्यां कूष्माण्डा शुभदास्तु मे ॥
aarti: aarti-kushmanda
