stutiName: कूष्माण्डा
color:
  name: { hinglish: Royal Blue, hi: गहरा नीला }
  hex: "#2747B8"
  note: { hinglish: Gehra neela (royal blue). Kala nahi., hi: गहरे नीले वस्त्र। काले नहीं। }
bhog: { hinglish: Roz wala hi, hi: रोज़ वाला ही }
