name: { hinglish: Maa Chandraghanta, hi: माँ चंद्रघंटा }
stutiName: चन्द्रघण्टा
color:
  name: { hinglish: Red, hi: लाल }
  hex: "#C62828"
  note: { hinglish: Laal ya maroon kapde. Kala nahi., hi: लाल या गहरे लाल वस्त्र। काले नहीं। }
