about:
  hinglish: Maathe par ghante ke aakar ka ardh-chandra — isliye naam Chandraghanta. Sher par sawar, das haathon mein astra. Shaanti aur veerta dono ki Devi.
  hi: मस्तक पर घंटे के आकार का अर्धचंद्र — इसीलिए नाम चंद्रघंटा। सिंह पर सवार, दस हाथों में अस्त्र। शांति और वीरता दोनों की देवी।
mool: ॐ देवी चन्द्रघण्टायै नमः ॥
dhyan:
  - पिण्डजप्रवरारूढा चण्डकोपास्त्रकैर्युता ।
  - प्रसादं तनुते मह्यं चन्द्रघण्टेति विश्रुता ॥
aarti: aarti-chandraghanta
