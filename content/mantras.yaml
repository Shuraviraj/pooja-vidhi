# Saare mantra yahin ek baar likhe hain. Din ki files inhe naam (id) se bulati hain.
# {tithi} us din ki file (tithi:) se apne-aap bharta hai. Vaar har saal badalta hai — isliye khali (______).

ya-devi:
  - या देवी सर्वभूतेषु शक्तिरूपेण संस्थिता ।
  - नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥

sarvamangal:
  - सर्वमङ्गलमाङ्गल्ये शिवे सर्वार्थसाधिके ।
  - शरण्ये त्र्यम्बके गौरि नारायणि नमोऽस्तु ते ॥

shuddhi:
  - ॐ अपवित्रः पवित्रो वा सर्वावस्थां गतोऽपि वा ।
  - यः स्मरेत्पुण्डरीकाक्षं स बाह्याभ्यन्तरः शुचिः ॥

ganesh:
  - ॐ गं गणपतये नमः ॥
  - वक्रतुण्ड महाकाय सूर्यकोटि समप्रभ ।
  - निर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा ॥

ganesh-beej:
  - ॐ गं गणपतये नमः ॥

sankalp:
  - हे माँ दुर्गा! आज ______ (वार), आश्विन शुक्ल {tithi}, नवरात्रि के पहले दिन, मैं ______ (नाम), ______ गोत्र, अपने और अपने परिवार के सुख, शांति और मंगल के लिए, नौ दिन तक आपकी श्रद्धा से पूजा करने का संकल्प लेती/लेता हूँ । माँ, मेरी पूजा स्वीकार करें ।

avahan:
  - आवाहयामि, स्थापयामि ॥

tambool:
  - ताम्बूलं दक्षिणां च समर्पयामि ॥

pushpanjali:
  - ॐ जयन्ती मङ्गला काली भद्रकाली कपालिनी ।
  - दुर्गा क्षमा शिवा धात्री स्वाहा स्वधा नमोऽस्तु ते ॥
  - पुष्पाञ्जलिं समर्पयामि ॥

kshama:
  - आवाहनं न जानामि न जानामि विसर्जनम् ।
  - पूजां चैव न जानामि क्षमस्व परमेश्वरि ॥
  - मन्त्रहीनं क्रियाहीनं भक्तिहीनं सुरेश्वरि ।
  - यत्पूजितं मया देवि परिपूर्णं तदस्तु मे ॥

saptashati-sankalp:
  - हे माँ दुर्गा! आज आश्विन शुक्ल {tithi} को मैं ______ (नाम) अपने परिवार के मंगल के लिए श्री दुर्गा सप्तशती का पाठ कर रही/रहा हूँ । माँ, इसे स्वीकार करें ।

samapan-prarthana:
  - माँ, नौ दिनों की हमारी पूजा स्वीकार करें और सदा कृपा बनाए रखें ।

jai-mata-di:
  - ॥ जय माता दी ॥
